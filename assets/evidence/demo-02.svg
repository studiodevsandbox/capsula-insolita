<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .3  0 0 0 0 .27  0 0 0 0 .22  0 0 0 .35 0"/>
    </filter>
  </defs>
  <rect width="760" height="980" fill="#efe8d8"/>
  <g font-family="Courier New, monospace" fill="#1d1b18">
    <text x="60" y="92" font-size="26" font-weight="bold">OFICINA DE ARCHIVO</text>
    <text x="60" y="126" font-size="18">EXPEDIENTE 17-B · USO RESTRINGIDO</text>
    <text x="60" y="200" font-size="18">ASUNTO: Registro nocturno, pasillo B.</text>
    <text x="60" y="250" font-size="18">El día 12 se recibió una grabación</text>
    <text x="60" y="280" font-size="18">correspondiente a las 23:41 h. En ella</text>
    <text x="60" y="310" font-size="18">aparece una persona no identificada</text>
    <text x="60" y="340" font-size="18">frente a la puerta del archivo.</text>
    <text x="60" y="400" font-size="18">El personal de guardia declaró que</text>
    <text x="60" y="430" font-size="18">a esa hora el edificio estaba cerrado.</text>
    <text x="60" y="490" font-size="18">Testigos consultados:</text>
    <text x="60" y="610" font-size="18">Se solicita revisar la cámara 2.</text>
  </g>
  <g fill="#0b0b0b">
    <rect x="300" y="472" width="260" height="22"/>
    <rect x="60" y="522" width="420" height="22"/>
    <rect x="60" y="556" width="300" height="22"/>
    <rect x="60" y="640" width="520" height="22"/>
  </g>
  <path d="M420 780 C 450 740, 480 800, 510 760 S 570 790, 600 750" fill="none" stroke="#1d1b18" stroke-width="3"/>
  <line x1="400" y1="806" x2="640" y2="806" stroke="#1d1b18" stroke-width="1.5"/>
  <text x="400" y="830" font-family="Courier New, monospace" font-size="14" fill="#1d1b18">FIRMA DEL RESPONSABLE</text>
  <g transform="rotate(-12 200 820)" fill="none" stroke="#a3131b" stroke-width="5" opacity=".85">
    <rect x="70" y="780" width="290" height="80"/>
    <text x="215" y="836" text-anchor="middle" font-family="Impact, sans-serif" font-size="40" fill="#a3131b" stroke="none" letter-spacing="4">CONFIDENCIAL</text>
  </g>
  <rect width="760" height="980" fill="#000" filter="url(#grain)"/>
</svg>
